<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aufgabentracker</title>
  <style>
    :root {
      --ink:#183153; --muted:#6b778c; --line:#dfe5ec; --paper:#fff;
      --bg:#f3f6f9; --blue:#2563eb; --blue-dark:#1d4ed8;
      --yellow:#fff1a8; --yellow-ink:#705700; --green:#bbf7d0; --green-ink:#14532d;
      --danger:#b42318; --shadow:rgba(24,49,83,.07);
    }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .app { max-width:1500px; margin:0 auto; padding:30px 24px 50px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:22px; }
    h1 { margin:0 0 4px; font-size:clamp(25px,3vw,38px); letter-spacing:-.04em; }
    .subtitle { margin:0; color:var(--muted); }
    .actions { display:flex; gap:9px; flex-wrap:wrap; }
    button { border:0; border-radius:9px; padding:10px 14px; font:600 14px inherit; cursor:pointer; transition:.15s; }
    button:hover { transform:translateY(-1px); }
    .primary { color:#fff; background:var(--blue); }
    .primary:hover { background:var(--blue-dark); }
    .secondary { color:var(--ink); background:#fff; border:1px solid var(--line); }
    .danger { color:var(--danger); background:#fff; border:1px solid #f0c5c1; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:15px; box-shadow:0 8px 26px var(--shadow); overflow:hidden; }
    .table-wrap { overflow:auto; max-height:72vh; }
    table { width:100%; min-width:760px; border-collapse:separate; border-spacing:0; }
    th,td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-width:145px; height:64px; text-align:center; }
    th { position:sticky; top:0; z-index:3; background:#edf3ff; padding:8px; }
    th:first-child,td:first-child { position:sticky; left:0; z-index:2; min-width:190px; background:#fff; }
    th:first-child { z-index:5; background:#dbe8ff; }
    th:last-child,td:last-child { position:sticky; right:0; z-index:2; min-width:150px; border-right:0; background:#fff; }
    th:last-child { z-index:5; background:#dbe8ff; }
    tr:last-child td { border-bottom:0; }
    .editable { width:100%; border:1px solid transparent; border-radius:7px; background:transparent; padding:8px; color:var(--ink); font:600 14px inherit; text-align:center; }
    .editable:hover,.editable:focus { border-color:#9bb7ec; background:#fff; outline:0; }
    .student { text-align:left; padding-left:12px; }
    .edit-wrap { display:flex; align-items:center; gap:2px; padding:0 5px; }
    .remove { flex:0 0 26px; padding:3px; color:#98a2b3; background:transparent; font-size:18px; }
    .remove:hover { color:var(--danger); transform:none; }
    .status { width:100%; height:100%; min-height:63px; border-radius:0; padding:6px; font-weight:750; }
    .status:hover { transform:none; filter:brightness(.98); }
    .open { color:#788396; background:#fff; }
    .solved { color:var(--yellow-ink); background:var(--yellow); }
    .done { color:var(--green-ink); background:var(--green); }
    .progress-cell { padding:10px 13px; }
    .progress-label { font-weight:750; margin-bottom:6px; }
    .progress { height:9px; border-radius:10px; background:#e8edf2; overflow:hidden; }
    .progress > span { display:block; height:100%; background:linear-gradient(90deg,#f6c945,#22a45d); transition:width .25s; }
    .empty { padding:45px 20px; color:var(--muted); text-align:center; }
    .legend { display:flex; align-items:center; flex-wrap:wrap; gap:12px 20px; padding:14px 16px; color:var(--muted); font-size:13px; }
    .key { display:inline-flex; align-items:center; gap:7px; }
    .swatch { width:15px; height:15px; border-radius:4px; border:1px solid rgba(0,0,0,.08); }
    .tip { margin-left:auto; }
    .student-panel { padding:22px; }
    .student-header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .eyebrow { display:inline-block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--blue); font-weight:700; margin-bottom:10px; }
    .student-header h2 { margin:0; font-size:clamp(26px,4vw,38px); }
    .student-tools { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .student-select { display:flex; align-items:center; gap:8px; color:var(--muted); font-weight:600; }
    .student-select select { border:1px solid var(--line); border-radius:8px; background:#fff; padding:8px 12px; font:inherit; color:var(--ink); }
    .student-summary { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:16px; margin:22px 0 18px; }
    .summary-card { background:linear-gradient(135deg,#eef4ff,#fff); border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px; }
    .summary-card span { display:block; color:var(--muted); font-size:13px; margin-bottom:8px; }
    .summary-card strong { font-size:clamp(26px,4vw,34px); letter-spacing:-.04em; }
    .task-list { display:grid; gap:12px; }
    .task-item { display:grid; grid-template-columns: minmax(0,1.8fr) minmax(170px,1fr); gap:12px; align-items:center; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .task-item h3 { margin:0; font-size:16px; }
    .task-actions { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
    .task-actions button { min-width:110px; }
    .task-actions .open { border:1px solid var(--line); }
    .task-actions .solved { border:1px solid rgba(112,87,0,.2); }
    .task-actions .done { border:1px solid rgba(20,83,45,.15); }
    .access-note { margin-top:18px; color:var(--muted); font-size:13px; }
    .landing { padding:22px 0; }
    .landing-card { background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:0 12px 28px rgba(24,49,83,.08); padding:28px 24px; max-width:760px; margin:0 auto; }
    .landing-kicker { display:inline-block; color:var(--blue); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:12px; margin-bottom:12px; }
    .landing-card h2 { margin:0 0 10px; font-size:clamp(28px,5vw,42px); letter-spacing:-.04em; }
    .landing-card p { margin:0 0 22px; color:var(--muted); font-size:16px; }
    .landing-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:16px; }
    .landing-btn { display:flex; flex-direction:column; align-items:flex-start; justify-content:center; min-height:120px; padding:20px; border-radius:14px; border:1px solid var(--line); background:#f9fbff; color:var(--ink); text-decoration:none; font:600 18px inherit; cursor:pointer; }
    .landing-btn:hover { transform:translateY(-1px); background:#fff; }
    .landing-btn small { color:var(--muted); margin-top:8px; font-weight:500; }
    .landing-students { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
    .student-pill { border:1px solid var(--line); background:#fff; color:var(--ink); padding:10px 14px; border-radius:999px; font-weight:600; cursor:pointer; }
    .student-pill:hover { border-color:var(--blue); color:var(--blue); }
    .access-box { margin-top:22px; background:#f7faff; border:1px solid var(--line); border-radius:14px; padding:18px; }
    .access-box h3 { margin:0 0 12px; font-size:18px; }
    .key-row { display:flex; gap:10px; flex-wrap:wrap; }
    .key-row input { flex:1 1 220px; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font:inherit; color:var(--ink); }
    .key-row button { background:var(--blue); color:#fff; }
    .access-table { width:100%; border-collapse:collapse; margin-top:12px; }
    .access-table th, .access-table td { border:1px solid var(--line); padding:10px 12px; text-align:left; }
    .access-table th { background:#edf3ff; }
    @media (max-width:700px) { .app{padding:18px 12px} header{align-items:flex-start;flex-direction:column}.tip{width:100%;margin:0}.task-item{grid-template-columns:1fr}.task-actions{justify-content:flex-start}.key-row{flex-direction:column} }
    @media print { body{background:#fff}.app{max-width:none;padding:0}.actions,.legend,.student-tools,.access-note{display:none}.panel{box-shadow:none}.table-wrap{overflow:visible;max-height:none}th,th:first-child,th:last-child{position:static}td:first-child,td:last-child{position:static} }
      #loginForm { display:grid; gap:16px; } #loginForm label { display:grid; gap:6px; } #loginForm input { padding:12px; border:1px solid var(--line); border-radius:8px; font:inherit; } button[aria-pressed="true"] { outline:3px solid var(--blue); outline-offset:2px; } button:disabled { opacity:.6; cursor:wait; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1 id="pageTitle">Aufgabentracker</h1>
        <p class="subtitle" id="pageSubtitle">Klassenübersicht für die Lehrperson</p>
      </div>
      <div class="actions" id="actionBar"></div>
    </header>
    <section id="viewRoot"></section>
  </main>
  <script type="module" src="./portal.js"></script>
</body>
</html>
